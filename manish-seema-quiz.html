<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पाठ 8: मनीष और सीमा — ऑनलाइन क्विज</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.6}
header{background:linear-gradient(120deg,#0f766e,#0d9488);color:#fff;text-align:center;padding:24px 14px}
header h1{margin:0;font-size:clamp(23px,5vw,32px)}header p{margin:6px 0 0}
main{max-width:820px;margin:20px auto;padding:0 12px 30px}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:bold;margin:12px 0}
.track{height:9px;border-radius:20px;background:#cbd5e1;overflow:hidden;margin-bottom:16px}
#bar{height:100%;width:0;background:#0d9488;transition:width .2s}
.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px #0f172a0a}
.q{font-weight:bold;font-size:18px;margin:0 0 13px}
.options{display:grid;gap:9px}
.option{width:100%;text-align:left;border:1px solid #cbd5e1;background:#f8fafc;border-radius:10px;padding:11px 12px;font-size:16px;color:#1e293b;cursor:pointer}
.option:hover:not(:disabled){background:#ecfeff;border-color:#0d9488}
.option:disabled{opacity:1;cursor:default}
.option.good{background:#dcfce7;border-color:#16a34a;color:#166534}
.option.bad{background:#fee2e2;border-color:#dc2626;color:#991b1b}
#feedback{font-weight:bold;margin-top:10px;min-height:24px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.btn{border:0;border-radius:10px;background:#0f766e;color:#fff;text-decoration:none;padding:11px 17px;font-weight:bold;font-size:16px;cursor:pointer;display:inline-block}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.btn.dark{background:#334155}
#result{display:none;text-align:center;background:#fff;border:2px solid #99f6e4;border-radius:14px;padding:22px}
#result h2{color:#0f766e;margin-top:0}
.note{font-size:14px;color:#64748b;text-align:center}
</style>
</head>
<body>
<header>
<h1>📘 पाठ 8: मनीष और सीमा</h1>
<p>कक्षा 8 हिन्दी | महत्वपूर्ण वस्तुनिष्ठ प्रश्न</p>
</header>
<main>
<div class="status"><span id="count">प्रश्न 1 / 25</span><span>स्कोर: <span id="score">0</span></span></div>
<div class="track"><div id="bar"></div></div>
<div id="quiz"></div>
<div class="actions" id="actions">
<button class="btn" id="next" disabled>अगला प्रश्न ➜</button>
<a class="btn dark" href="class8.html">↩ कक्षा 8 पर वापस जाएँ</a>
</div>
<section id="result">
<h2>🎉 क्विज़ पूरा हुआ!</h2>
<p id="final"></p><p id="message"></p>
<div class="actions">
<button class="btn" onclick="restart()">🔄 दोबारा टेस्ट दें</button>
<a class="btn dark" href="class8.html">↩ कक्षा 8 पर वापस जाएँ</a>
</div>
</section>
<p class="note">उत्तर चुनते ही सही उत्तर और प्रतिक्रिया दिखाई देगी।</p>
</main>
<script>
const questions=[
{q:"लड़के का नाम क्या था?",o:["मनीष","रमेश","सुरेश","मोहन"],a:0},
{q:"मनीष की बहन का नाम क्या था?",o:["राधा","सीमा","रीमा","गीता"],a:1},
{q:"मनीष क्या बेचकर जीवन बसर कर रहा था?",o:["अख़बार","खिलौने","गुब्बारे","फल"],a:2},
{q:"मनीष के पिता की क्या स्थिति थी?",o:["वे बाहर गए थे","उनकी मृत्यु हो चुकी थी","वे शिक्षक थे","वे दुकान चलाते थे"],a:1},
{q:"मनीष गुब्बारे क्यों बेचता था?",o:["घूमने के लिए","परिवार का पालन-पोषण करने के लिए","खेलने के लिए","दोस्तों के लिए"],a:1},
{q:"‘पढ़ोगे?’ पूछने पर मनीष ने क्या किया?",o:["हाँ में सिर हिलाया","न में सिर हिलाया","भाग गया","हँसने लगा"],a:1},
{q:"बच्चों को किस संस्था के अन्तर्गत पढ़ाने ले जाया गया?",o:["प्रेरणा सहायता सोसाइटी","नगर समिति","बाल क्लब","युवा मंडल"],a:0},
{q:"मनीष क्या बनना चाहता था?",o:["डॉक्टर","अध्यापक","पुलिस इंस्पेक्टर","वकील"],a:2},
{q:"सीमा क्या बनना चाहती थी?",o:["अध्यापिका","डॉक्टर","पुलिस अधिकारी","लेखिका"],a:0},
{q:"‘संकेत’ शब्द का अर्थ क्या है?",o:["इशारा","आदेश","रास्ता","उत्तर"],a:0},
{q:"‘पारखी’ का अर्थ क्या है?",o:["जल्दी चलने वाला","परखने की शक्ति रखने वाला","बात करने वाला","चित्र बनाने वाला"],a:1},
{q:"‘अनसुनी’ का अर्थ क्या है?",o:["ध्यान से सुनना","ध्यान न देना","दोहराना","धीरे बोलना"],a:1},
{q:"‘चेष्टा’ का अर्थ क्या है?",o:["कोशिश","आराम","सफलता","गलती"],a:0},
{q:"‘अन्तर्गत’ का अर्थ क्या है?",o:["बाहर निकला हुआ","दूर स्थित","भीतर समाया हुआ","ऊपर रखा हुआ"],a:2},
{q:"‘अपनापन’ का अर्थ क्या है?",o:["दूरी","आत्मीयता","नाराज़गी","डर"],a:1},
{q:"‘दयनीय अवस्था’ का अर्थ क्या है?",o:["खुशहाल हालत","दीन-हीन हालत","सामान्य हालत","स्वस्थ हालत"],a:1},
{q:"‘नाराज़गी’ का विलोम शब्द क्या है?",o:["क्रोध","प्रसन्नता","दुःख","चिंता"],a:1},
{q:"‘इन्कार’ का विलोम शब्द क्या है?",o:["अस्वीकार","इकरार","विरोध","मनाही"],a:1},
{q:"‘साकार’ का विलोम शब्द क्या है?",o:["आकार","प्रकार","निराकार","संसार"],a:2},
{q:"‘बदकिस्मत’ का विलोम शब्द क्या है?",o:["दुखी","खुशकिस्मत","बेचारा","कमज़ोर"],a:1},
{q:"‘मैं जल्दी-जल्दी काम निपटाकर पहुँची।’ क्रिया-विशेषण कौन-सा है?",o:["काम","पहुँची","जल्दी-जल्दी","मैं"],a:2},
{q:"‘वह मेरी तरफ एकटक देखने लगा।’ क्रिया-विशेषण कौन-सा है?",o:["वह","तरफ","देखने","एकटक"],a:3},
{q:"‘मैं कल आऊँगी।’ क्रिया-विशेषण कौन-सा है?",o:["मैं","कल","आऊँगी","कोई नहीं"],a:1},
{q:"‘अरे! तुम पढ़ोगे नहीं?’ में विस्मयादिबोधक शब्द कौन-सा है?",o:["तुम","पढ़ोगे","नहीं","अरे"],a:3},
{q:"‘उससे रहा नहीं गया।’ में कौन-सा वाच्य है?",o:["कर्तृवाच्य","कर्मवाच्य","भाववाच्य","इनमें से कोई नहीं"],a:2}
];
let current=0,score=0,answered=false;
const quiz=document.getElementById("quiz"),next=document.getElementById("next");
function render(){
 answered=false;next.disabled=true;
 document.getElementById("count").textContent=`प्रश्न ${current+1} / ${questions.length}`;
 document.getElementById("score").textContent=score;
 document.getElementById("bar").style.width=`${current/questions.length*100}%`;
 const item=questions[current];
 quiz.innerHTML=`<section class="card"><p class="q">${current+1}. ${item.q}</p><div class="options">${item.o.map((x,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join("")}</div><div id="feedback" aria-live="polite"></div></section>`;
 quiz.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>answer(Number(b.dataset.i))));
 next.textContent=current===questions.length-1?"परिणाम देखें 🏁":"अगला प्रश्न ➜";
}
function answer(i){
 if(answered)return;answered=true;
 const item=questions[current],buttons=quiz.querySelectorAll(".option"),fb=document.getElementById("feedback");
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add("good");if(j===i&&i!==item.a)b.classList.add("bad")});
 if(i===item.a){score++;fb.textContent="✅ बिल्कुल सही उत्तर!";fb.style.color="#15803d"}
 else{fb.textContent="❌ सही उत्तर: "+item.o[item.a];fb.style.color="#b91c1c"}
 document.getElementById("score").textContent=score;next.disabled=false;
}
next.addEventListener("click",()=>{
 if(!answered)return;
 if(current<questions.length-1){current++;render();return}
 quiz.style.display="none";document.getElementById("actions").style.display="none";document.getElementById("result").style.display="block";document.getElementById("bar").style.width="100%";document.getElementById("count").textContent="क्विज़ पूरा हुआ";
 document.getElementById("final").textContent=`आपका स्कोर: ${score} / ${questions.length}`;
 document.getElementById("message").textContent=score>=22?"शानदार! आपकी तैयारी बहुत अच्छी है।":score>=16?"बहुत अच्छा! थोड़ा और अभ्यास करें।":"अच्छा प्रयास! दोबारा टेस्ट देकर अभ्यास करें।";
});
function restart(){current=0;score=0;quiz.style.display="block";document.getElementById("actions").style.display="flex";document.getElementById("result").style.display="none";render()}
render();
</script>
</body>
</html>
