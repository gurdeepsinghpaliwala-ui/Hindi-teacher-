<script>
  const quizData = [
    { q: "1. 'सदा + एव' की सही संधि क्या होगी?", options: ["सदाएव", "सदैव", "सदोव", "सादैव"], correct: 1 },
    { q: "2. 'सूर्योदय' शब्द का सही संधि-विच्छेद चुनिए:", options: ["सूर्य + दय", "सूर्यो + दय", "सूर्य + उदय", "सूरी + उदय"], correct: 2 },
    { q: "3. 'प्रति + एक' के मेल से कौन-सा शब्द बनेगा?", options: ["प्रत्येक", "प्रतिक", "प्रत्यक", "प्रतिएक"], correct: 0 },
    { q: "4. 'पवन' शब्द का सही संधि-विच्छेद क्या होगा?", options: ["पव + न", "पो + अन", "पौ + अन", "पा + वन"], correct: 1 },
    { q: "5. 'पुस्तकालय' में कौन-सी संधि है?", options: ["गुण संधि", "यण संधि", "दीर्घ संधि", "अयादि संधि"], correct: 2 },
    { q: "6. 'महेश' शब्द का सही संधि-विच्छेद क्या होगा?", options: ["मह + ईश", "महा + ईश", "महि + ईश", "मा + हेश"], correct: 1 },
    { q: "7. 'सु + आगत' के मेल से कौन-सा शब्द बनेगा?", options: ["सुआगत", "स्वागत", "स्वगत", "सवागत"], correct: 1 },
    { q: "8. 'नयन' शब्द का सही संधि-विच्छेद क्या होगा?", options: ["नय + न", "नै + अन", "ने + अन", "नो + अन"], correct: 2 },
    { q: "9. 'इति + आदि' की सही संधि क्या होगी?", options: ["इतिआदि", "इत्यादि", "इतादि", "इत्यदि"], correct: 1 },
    { q: "10. 'हिमालय' शब्द का सही संधि-विच्छेद क्या है?", options: ["हिम + आलय", "हिमो + लय", "हिमा + लय", "हिम + लय"], correct: 0 },
    { q: "11. 'परोपकार' शब्द का सही संधि-विच्छेद क्या है?", options: ["परो + उपकार", "पर + उपकार", "पर + अपकार", "पारा + उपकार"], correct: 1 },
    { q: "12. 'रवीन्द्र' शब्द का सही संधि-विच्छेद क्या है?", options: ["रवि + इन्द्र", "रव + इन्द्र", "रवी + इन्द्र", "रवि + इंद्र"], correct: 0 },
    { q: "13. 'सूक्ति' शब्द का सही संधि-विच्छेद क्या है?", options: ["सु + उक्ति", "सू + उक्ति", "सु + की", "सू + क्ति"], correct: 0 },
    { q: "14. 'सुरेन्द्र' का सही संधि-विच्छेद क्या होगा?", options: ["सुर + इन्द्र", "सु + इन्द्र", "सुरे + इन्द्र", "सुरा + इन्द्र"], correct: 0 },
    { q: "15. 'यथेष्ट' शब्द का संधि-विच्छेद क्या है?", options: ["यथा + इष्ट", "यथ + इष्ट", "यथो + इष्ट", "यथा + ईष्ट"], correct: 0 }
  ];

  const quizContainer = document.getElementById("quiz-container");

  quizData.forEach((item, index) => {
    const box = document.createElement("div");
    box.className = "quiz-q-box";

    box.innerHTML = `
      <div class="quiz-q-title">${item.q}</div>
      <div class="quiz-options">
        ${item.options.map((option, i) => `
          <label>
            <input type="radio" name="quiz-${index}" value="${i}">
            ${String.fromCharCode(0x0915 + i)}) ${option}
          </label>
        `).join("")}
      </div>
    `;

    quizContainer.appendChild(box);
  });

  function evaluateSandhiQuiz() {
    let score = 0;
    let attempted = 0;

    quizData.forEach((item, index) => {
      const selected = document.querySelector(
        `input[name="quiz-${index}"]:checked`
      );

      if (selected) {
        attempted++;

        if (Number(selected.value) === item.correct) {
          score++;
        }
      }
    });

    document.getElementById("quiz-result").innerHTML =
      `आपका स्कोर: <b>${score}/${quizData.length}</b><br>
       प्रयास किए गए: ${attempted}/${quizData.length}`;
  }
</script>
