<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>पाठ 4-5 लिंग और वचन परिवर्तन Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#f1f5f9;color:#172033;font-family:Arial,"Noto Sans Devanagari",sans-serif;line-height:1.6}
.card{max-width:700px;margin:18px auto;background:white;border-radius:18px;padding:20px;box-shadow:0 6px 22px #00000012}
h1{font-size:22px;color:#1e3a8a;margin:0 0 6px}
.sub{color:#64748b;margin:0 0 16px}
.tabs{display:flex;gap:10px;margin:16px 0}
.tab{flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:#f8fafc;font-size:16px;font-weight:bold;cursor:pointer}
.tab.active{background:#1d4ed8;color:white;border-color:#1d4ed8}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#eff6ff;padding:10px;border-radius:10px;font-weight:bold}
#question{font-size:21px;font-weight:bold;margin:20px 0 14px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:12px;text-align:left;border:1px solid #cbd5e1;border-radius:10px;background:white;color:#172033;font-size:17px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.correct{background:#dcfce7;border-color:#22c55e;color:#166534}
.opt.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
#feedback{display:none;margin-top:14px;padding:12px;border-radius:10px;font-weight:bold}
#feedback.good{display:block;background:#dcfce7;color:#166534}
#feedback.bad{display:block;background:#fee2e2;color:#991b1b}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.action{border:0;border-radius:10px;padding:12px 17px;font-size:16px;font-weight:bold;cursor:pointer}
.next{background:#1d4ed8;color:white}
.restart{background:#e2e8f0;color:#172033}
.action:disabled{opacity:.45;cursor:not-allowed}
#result{display:none;text-align:center;padding:20px}
.finalScore{font-size:30px;font-weight:bold;color:#1d4ed8}
@media(max-width:480px){.card{padding:14px}h1{font-size:20px}#question{font-size:19px}.options{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card">
<h1>📚 लिंग और वचन परिवर्तन — कक्षा 9</h1>
<p class="sub">PSEB हिंदी Quiz • एक बार में एक प्रश्न</p>

<div class="tabs">
<button id="lingTab" class="tab active" onclick="changeSection('ling')">लिंग परिवर्तन</button>
<button id="vachanTab" class="tab" onclick="changeSection('vachan')">वचन परिवर्तन</button>
</div>

<section id="play">
<div class="stats">
<span id="number">प्रश्न 1</span>
<span id="score">अंक: 0</span>
</div>
<div id="question"></div>
<div id="options" class="options"></div>
<div id="feedback" aria-live="polite"></div>
<div class="buttons">
<button id="next" class="action next" onclick="nextQuestion()" disabled>अगला प्रश्न ➜</button>
<button class="action restart" onclick="restart()">फिर से करें ↻</button>
</div>
</section>

<section id="result">
<h2>🎉 Quiz पूरा हुआ!</h2>
<div id="finalScore" class="finalScore"></div>
<p id="message"></p>
<div class="buttons" style="justify-content:center">
<button class="action next" onclick="restart()">दोबारा खेलें ↻</button>
<button class="action restart" onclick="backToQuiz()">प्रश्नों पर वापस जाएँ</button>
</div>
</section>
</main>

<script>
const ling = [
["भाई","बहन"],["पुत्र","पुत्री"],["लड़का","लड़की"],
["राजा","रानी"],["पिता","माता"],["पति","पत्नी"],
["देव","देवी"],["लेखक","लेखिका"],["अध्यापक","अध्यापिका"],
["गायक","गायिका"],["नायक","नायिका"],["सेवक","सेविका"],
["अभिनेता","अभिनेत्री"],["शिक्षक","शिक्षिका"],["छात्र","छात्रा"],
["बालक","बालिका"],["मालिक","मालकिन"],["धोबी","धोबिन"],
["शेर","शेरनी"],["बाघ","बाघिन"],["घोड़ा","घोड़ी"],
["बकरा","बकरी"],["मोर","मोरनी"],["हाथी","हथिनी"],
["ऊँट","ऊँटनी"],["कुत्ता","कुतिया"],["मुर्गा","मुर्गी"],
["नर","मादा"],["पुरुष","स्त्री"],["सम्राट","सम्राज्ञी"],
["विद्वान","विदुषी"],["स्वामी","स्वामिनी"],["साधु","साध्वी"],
["वर","वधू"],["दूल्हा","दुल्हन"],["शिष्य","शिष्या"]
];

const vachan = [
["लड़का","लड़के"],["लड़की","लड़कियाँ"],["बच्चा","बच्चे"],
["किताब","किताबें"],["कहानी","कहानियाँ"],["नदी","नदियाँ"],
["चिड़िया","चिड़ियाँ"],["गुड़िया","गुड़ियाँ"],["माला","मालाएँ"],
["कक्षा","कक्षाएँ"],["लता","लताएँ"],["बात","बातें"],
["रात","रातें"],["आँख","आँखें"],["सड़क","सड़कें"],
["कलम","कलमें"],["बोतल","बोतलें"],["मछली","मछलियाँ"],
["बहू","बहुएँ"],["वस्तु","वस्तुएँ"],["वधू","वधुएँ"],
["माता","माताएँ"],["गाय","गायें"],["कुर्सी","कुर्सियाँ"],
["थाली","थालियाँ"],["चाबी","चाबियाँ"],["टोपी","टोपियाँ"],
["रोटी","रोटियाँ"]
];

/* मिलते-जुलते वर्तनी वाले विकल्प */
const nearOptions = {
"बहन":["बहिन","बहनें","बहू"],
"पुत्री":["पुत्र","पुत्रीया","पुत्रियाँ"],
"लड़की":["लड़के","लड़कियाँ","लड़कीयाँ"],
"रानी":["राणा","रानीयाँ","रानी"],
"माता":["माता","मातृ","माताएँ"],
"पत्नी":["पत्नि","पति","पत्नियाँ"],
"देवी":["देवि","देव","देवियाँ"],
"लेखिका":["लेखक","लेखीक़ा","लेखिकाएँ"],
"अध्यापिका":["अध्यापिका","अध्यापीका","अध्यापक"],
"गायिका":["गायका","गायिका","गायक"],
"नायिका":["नायिका","नाइका","नायक"],
"सेविका":["सेविका","सेवीका","सेवक"],
"अभिनेत्री":["अभिनेत्री","अभिनेत्रि","अभिनेता"],
"शिक्षिका":["शिक्षिका","शिक्षीका","शिक्षक"],
"छात्रा":["छात्रा","छात्र","छात्राएँ"],
"बालिका":["बालिका","बालीका","बालक"],
"मालकिन":["मालकीन","मालिक","मालकिनें"],
"धोबिन":["धोबीन","धोबी","धोबिनें"],
"शेरनी":["शेरनी","शेरनीं","शेर"],
"बाघिन":["बाघीन","बाघिन","बाघ"],
"घोड़ी":["घोड़ी","घोड़ीं","घोड़ा"],
"बकरी":["बकरी","बकरि","बकरा"],
"मोरनी":["मोरनी","मोरनीं","मोर"],
"हथिनी":["हथनी","हथिनी","हाथी"],
"ऊँटनी":["ऊँटनी","ऊँटनीं","ऊँट"],
"कुतिया":["कुतिया","कुत्ती","कुत्ता"],
"मुर्गी":["मुर्गी","मुर्गीया","मुर्गा"],
"मादा":["मादा","माधा","नर"],
"स्त्री":["स्त्री","स्त्रि","पुरुष"],
"सम्राज्ञी":["सम्राज्ञी","सम्राग्नी","सम्राट"],
"विदुषी":["विदुषी","विदूषी","विद्वान"],
"स्वामिनी":["स्वामिनी","स्वामीनी","स्वामी"],
"साध्वी":["साध्वी","साधवी","साधु"],
"वधू":["वधू","वधु","वर"],
"दुल्हन":["दुल्हन","दुलहन","दूल्हा"],
"शिष्या":["शिष्या","शिश्या","शिष्य"],
"लड़के":["लड़के","लड़को","लड़का"],
"लड़कियाँ":["लड़कियाँ","लड़किया","लड़कीयाँ"],
"बच्चे":["बच्चे","बच्चें","बच्चा"],
"किताबें":["किताबें","किताबे","किताब"],
"कहानियाँ":["कहानियाँ","कहानिया","कहानीयाँ"],
"नदियाँ":["नदियाँ","नदिया","नदीयाँ"],
"चिड़ियाँ":["चिड़ियाँ","चिड़िया","चिड़ीयाँ"],
"गुड़ियाँ":["गुड़ियाँ","गुड़िया","गुड़ीयाँ"],
"मालाएँ":["मालाएँ","मालाये","माला"],
"कक्षाएँ":["कक्षाएँ","कक्षाये","कक्षा"],
"लताएँ":["लताएँ","लताये","लता"],
"बातें":["बातें","बाते","बात"],
"रातें":["रातें","राते","रात"],
"आँखें":["आँखें","आँखे","आँख"],
"सड़कें":["सड़कें","सड़के","सड़क"],
"कलमें":["कलमें","कलमे","कलम"],
"बोतलें":["बोतलें","बोतले","बोतल"],
"मछलियाँ":["मछलियाँ","मछलिया","मछलीयाँ"],
"बहुएँ":["बहुएँ","बहुए","बहूयें"],
"वस्तुएँ":["वस्तुएँ","वस्तुये","वस्तु"],
"वधुएँ":["वधुएँ","वधुए","वधूयें"],
"माताएँ":["माताएँ","माताये","माता"],
"गायें":["गायें","गाये","गाय"],
"कुर्सियाँ":["कुर्सियाँ","कुर्सिया","कुर्सीयाँ"],
"थालियाँ":["थालियाँ","थालिया","थालीयाँ"],
"चाबियाँ":["चाबियाँ","चाबिया","चाबीया"],
"टोपियाँ":["टोपियाँ","टोपिया","टोपीयाँ"],
"रोटियाँ":["रोटियाँ","रोटिया","रोटीया"]
};

let section = "ling";
let index = 0;
let score = 0;
let answered = false;
let order = [];

function data(){ return section === "ling" ? ling : vachan; }

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getChoices(item){
  const correct = item[1];
  const pairList = data();
  let close = (nearOptions[correct] || []).filter(x => x !== correct);

  /* दूसरे प्रश्नों के उत्तरों से भी मिलते-जुलते विकल्प जोड़ें */
  const otherAnswers = pairList
    .filter(x => x[1] !== correct && x[0] !== item[0])
    .map(x => x[1]);

  close = [...new Set(close)];
  const choices = [correct];

  /* पहले मिलते-जुलते विकल्प */
  close.forEach(x => {
    if(choices.length < 4 && !choices.includes(x)) choices.push(x);
  });

  /* फिर उसी पाठ के दूसरे उत्तर */
  shuffle(otherAnswers).forEach(x => {
    if(choices.length < 4 && !choices.includes(x)) choices.push(x);
  });

  return shuffle(choices);
}

function changeSection(which){
  section = which;
  document.getElementById("lingTab").classList.toggle("active",section==="ling");
  document.getElementById("vachanTab").classList.toggle("active",section==="vachan");
  restart();
}

function restart(){
  index=0;
  score=0;
  answered=false;
  order=shuffle(data().map((_,i)=>i));
  document.getElementById("play").style.display="block";
  document.getElementById("result").style.display="none";
  render();
}

function render(){
  answered=false;
  const arr=data();
  if(index>=arr.length){showResult();return;}

  const item=arr[order[index]];
  document.getElementById("number").textContent=`प्रश्न ${index+1} / ${arr.length}`;
  document.getElementById("score").textContent=`अंक: ${score}`;
  document.getElementById("question").textContent =
    section==="ling"
    ? `“${item[0]}” का स्त्रीलिंग चुनिए।`
    : `“${item[0]}” का बहुवचन चुनिए।`;

  const fb=document.getElementById("feedback");
  fb.className="";
  fb.textContent="";
  fb.style.display="none";

  const next=document.getElementById("next");
  next.disabled=true;
  next.textContent=index===arr.length-1?"परिणाम देखें":"अगला प्रश्न ➜";

  const box=document.getElementById("options");
  box.innerHTML="";

  getChoices(item).forEach((choice,i)=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="opt";
    b.textContent=String.fromCharCode(65+i)+". "+choice;
    b.onclick=()=>checkAnswer(b,choice,item[1]);
    box.appendChild(b);
  });
}

function checkAnswer(button,selected,correct){
  if(answered)return;
  answered=true;

  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.textContent.slice(3)===correct)b.classList.add("correct");
  });

  const fb=document.getElementById("feedback");
  if(selected===correct){
    score++;
    fb.textContent="✅ बिल्कुल सही! सही उत्तर: "+correct;
    fb.className="good";
  }else{
    button.classList.add("wrong");
    fb.textContent="❌ उत्तर गलत है। सही उत्तर: "+correct;
    fb.className="bad";
  }

  fb.style.display="block";
  document.getElementById("score").textContent="अंक: "+score;
  document.getElementById("next").disabled=false;
}

function nextQuestion(){
  if(!answered)return;
  if(index<data().length-1){
    index++;
    render();
  }else{
    showResult();
  }
}

function showResult(){
  document.getElementById("play").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("finalScore").textContent=`${score} / ${data().length}`;
  document.getElementById("message").textContent=
    `आपका परिणाम ${Math.round(score/data().length*100)}% है।`;
}

function backToQuiz(){
  document.getElementById("result").style.display="none";
  document.getElementById("play").style.display="block";
  render();
}

restart();
</script>
</body>
</html>
