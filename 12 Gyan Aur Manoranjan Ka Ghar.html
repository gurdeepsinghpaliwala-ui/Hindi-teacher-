<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पाठ 12: ज्ञान और मनोरंजन का घर — ऑनलाइन क्विज़</title>
<style>
:root {
  --site-primary: #6d28d9;
  --site-secondary: #ede9fe;
  --site-on-secondary: #4c1d95;
  --site-background: #f7f4ff;
  --site-on-background: #172033;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Noto Sans Devanagari", sans-serif;
  background: linear-gradient(135deg, #ede9fe, #dbeafe 55%, #fce7f3);
  color: #172033;
}
#app {
  min-height: 100vh;
  padding: 24px;
  background: linear-gradient(160deg, #faf8ff, #eef5ff);
}
.wrap { width: min(760px, 100%); margin: 0 auto; }
.hero {
  background: linear-gradient(135deg, #6d28d9, #2563eb 65%, #0891b2);
  color: white;
  padding: 28px;
  border-radius: 24px;
  box-shadow: 0 14px 32px #4338ca35;
  position: relative;
  overflow: hidden;
}
.kicker { font-size: .88rem; margin-bottom: 8px; }
h1 { font-size: 1.65rem; line-height: 1.4; margin: 0 0 8px; }
.hero p { margin: 0; line-height: 1.6; }
.hero::after {
  content: "🧠 ✨ 🎯";
  display: block;
  margin-top: 16px;
  font-size: 1.25rem;
  letter-spacing: 8px;
}
.panel {
  background: white;
  border: 1px solid #e0d7ff;
  border-radius: 22px;
  padding: 24px;
  margin-top: 18px;
  box-shadow: 0 10px 28px #4338ca12;
}
.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  font-weight: 700;
}
.pill {
  background: var(--site-secondary);
  color: var(--site-on-secondary);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: .88rem;
  white-space: nowrap;
}
.track {
  height: 11px;
  background: #e9e5f5;
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 22px;
}
#bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #8b5cf6, #2563eb, #06b6d4);
  border-radius: 99px;
  transition: width .3s ease;
}
#question {
  font-size: 1.2rem;
  line-height: 1.65;
  margin: 0 0 18px;
}
.answers { display: grid; gap: 11px; }
.answer {
  border: 2px solid #e1ddf0;
  background: white;
  color: #172033;
  border-radius: 15px;
  padding: 15px 16px;
  text-align: left;
  font: inherit;
  cursor: pointer;
  transition: transform .15s, border-color .15s, background .15s;
  box-shadow: 0 3px 8px #312e8110;
  position: relative;
  overflow: hidden;
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: optionIn .32s both;
}
.answer:nth-child(2) { animation-delay: .04s; }
.answer:nth-child(3) { animation-delay: .08s; }
.answer:nth-child(4) { animation-delay: .12s; }
.answer:hover:not(:disabled) {
  border-color: #6d28d9;
  background: #f5f3ff;
  transform: translateY(-2px);
}
.answer:focus-visible, .btn:focus-visible {
  outline: 3px solid #f59e0b;
  outline-offset: 3px;
}
.answer:disabled { cursor: default; }
.answer .letter {
  display: inline-grid;
  place-items: center;
  flex: 0 0 34px;
  height: 34px;
  border-radius: 11px;
  background: #ede9fe;
  color: #5b21b6;
  font-weight: 850;
}
.answer .choice-text { position: relative; z-index: 1; }
.answer.correct {
  border-color: #16834a;
  background: linear-gradient(110deg, #dcfce7, #f0fdf4);
  color: #14532d;
  animation: popCorrect .42s ease;
}
.answer.correct .letter { background: #16a34a; color: white; }
.answer.wrong {
  border-color: #c83737;
  background: linear-gradient(110deg, #fee2e2, #fff1f2);
  color: #8b1f1f;
  animation: nudgeWrong .35s ease;
}
.answer.wrong .letter { background: #dc2626; color: white; }
@keyframes optionIn {
  from { opacity: 0; transform: translateY(9px) scale(.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes popCorrect {
  0%, 100% { transform: scale(1); }
  45% { transform: scale(1.025); }
}
@keyframes nudgeWrong {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
#feedback {
  min-height: 28px;
  font-weight: 700;
  margin-top: 15px;
  line-height: 1.5;
}
#feedback:not(:empty) {
  padding: 13px 15px;
  border-radius: 14px;
  background: linear-gradient(135deg, #ede9fe, #dbeafe);
  color: #3b2877;
  animation: optionIn .25s ease;
}
.quiz-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 0 16px;
  flex-wrap: wrap;
}
.sound-btn {
  border: 1px solid #c4b5fd;
  border-radius: 999px;
  padding: 8px 12px;
  background: white;
  color: #5b21b6;
  font: inherit;
  font-weight: 750;
  cursor: pointer;
}
.streak { color: #7c3aed; font-weight: 800; font-size: .92rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.btn {
  border: 0;
  border-radius: 14px;
  padding: 13px 19px;
  font: inherit;
  font-weight: 750;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 14px #312e8125;
}
.primary { background: linear-gradient(135deg, #6d28d9, #2563eb); color: white; }
.secondary { background: #ede9fe; color: #4c1d95; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
#result { text-align: center; }
.score { font-size: 2.6rem; font-weight: 850; color: #6d28d9; margin: 12px 0; }
.result-message { line-height: 1.7; }
.hidden { display: none !important; }
footer { text-align: center; opacity: .72; font-size: .85rem; padding: 18px 0 4px; }
.confetti {
  position: fixed;
  top: -18px;
  z-index: 99;
  pointer-events: none;
  font-size: 22px;
  animation: fall 1.5s ease-in forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(540deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
@media (max-width: 520px) {
  #app { padding: 14px; }
  .hero { padding: 21px; }
  .panel { padding: 17px; }
  h1 { font-size: 1.45rem; }
}
</style>
</head>
<body>
<div id="app">
  <main class="wrap">
    <header class="hero">
      <div class="kicker">✨ खेल-खेल में सीखो · हर सवाल में कमाल करो!</div>
      <h1>पाठ 12: ज्ञान और मनोरंजन का घर</h1>
      <p>🎯 25 मज़ेदार सवाल · जवाब चुनो, रंग बदलते देखो और अपना ज्ञान बढ़ाओ!</p>
    </header>

    <section id="quiz" class="panel" aria-live="polite">
      <div class="topline">
        <span id="counter">📝 प्रश्न 1 / 25</span>
        <span class="pill" id="scoreTag">🏆 अंक: 0</span>
      </div>

      <div class="quiz-tools">
        <span class="streak" id="streak">🔥 चलो शुरू करें!</span>
        <button type="button" id="soundToggle" class="sound-btn" aria-pressed="false">🔊 मज़ेदार आवाज़: बंद</button>
      </div>

      <div class="track"><div id="bar"></div></div>
      <h2 id="question">🤔 प्रश्न यहाँ दिखाई देगा</h2>
      <div id="answers" class="answers"></div>
      <div id="feedback" role="status"></div>

      <div class="actions">
        <button id="next" class="btn primary" disabled>अगला सवाल 🚀</button>
        <button id="restartSmall" class="btn secondary">🔄 फिर से शुरू करें</button>
      </div>
    </section>

    <section id="result" class="panel hidden">
      <div class="pill">🎉 क्विज़ पूरा हुआ</div>
      <h2>वाह! आपने कर दिखाया! 🎉</h2>
      <div class="score" id="finalScore">0 / 25</div>
      <p class="result-message" id="resultMessage"></p>
      <div class="actions" style="justify-content:center">
        <button id="again" class="btn primary">🔁 फिर से क्विज़ दें</button>
        <button id="back" class="btn secondary">↩ वापस आएँ</button>
      </div>
    </section>

    <footer>पाठ 12 · ज्ञान और मनोरंजन का घर</footer>
  </main>
</div>

<script>
const questions = [
 {q:"साइंस सिटी का पूरा नाम क्या है?",a:["पुष्पा गुजराल साइंस सिटी","पंजाब साइंस सेंटर","इंद्र कुमार साइंस सिटी","राष्ट्रीय विज्ञान भवन"],c:0,e:"साइंस सिटी का पूरा नाम पुष्पा गुजराल साइंस सिटी है।"},
 {q:"पुष्पा गुजराल साइंस सिटी किसके नाम पर रखी गई है?",a:["एक वैज्ञानिक के नाम पर","इंद्र कुमार गुजराल जी की माता जी के नाम पर","एक अध्यापिका के नाम पर","एक राज्यपाल के नाम पर"],c:1,e:"यह पूर्व प्रधानमंत्री इंद्र कुमार गुजराल जी की माता जी के नाम पर रखी गई है।"},
 {q:"पाठ के अनुसार साइंस सिटी का उद्घाटन कब हुआ?",a:["19 मार्च, 2005","15 अगस्त, 2004","26 जनवरी, 2006","19 अप्रैल, 2005"],c:0,e:"पाठ के अनुसार उद्घाटन 19 मार्च, 2005 को हुआ।"},
 {q:"साइंस सिटी का उद्घाटन किसने किया?",a:["प्रधानाचार्य ने","मुख्यमंत्री ने","राज्यपाल एस. एफ. रोडरिज ने","विज्ञान शिक्षक ने"],c:2,e:"पाठ में राज्यपाल एस. एफ. रोडरिज का नाम दिया गया है।"},
 {q:"दिल के मॉडल में क्या दिखाया गया है?",a:["पाचन प्रणाली","रक्त संचार प्रणाली","श्वसन प्रणाली","हड्डियों की बनावट"],c:1,e:"दिल के मॉडल में रक्त संचार प्रणाली दिखाई गई है।"},
 {q:"डायनासोर पार्क में कितनी तरह के डायनासोर बताए गए हैं?",a:["12","20","26","45"],c:2,e:"पाठ के प्रश्न-उत्तर के अनुसार 26 तरह के डायनासोर हैं।"},
 {q:"वोल्केनो आकृति में कितने डायनासोर दिखाई देते हैं?",a:["दो","तीन","चार","छह"],c:2,e:"35 फुट ऊँची आकृति में चार डायनासोर हैं।"},
 {q:"डोम थियेटर का फ्रेम आम थियेटर से कितना बड़ा बताया गया है?",a:["दो गुणा","पाँच गुणा","दस गुणा","बीस गुणा"],c:2,e:"डोम थियेटर का फ्रेम आम थियेटर से दस गुणा बड़ा है।"},
 {q:"फ्लाइट सिमुलेटर में क्या दिखाया जाता है?",a:["समुद्री यात्रा","वीडियो के माध्यम से हवाई उड़ान","रेल यात्रा","अंतरिक्ष की किताबें"],c:1,e:"स्क्रीन पर वीडियो के माध्यम से हवाई उड़ान दिखाई जाती है।"},
 {q:"विजयंत टैंक और मिग 23 कहाँ रखे हैं?",a:["हेल्थ गैलरी में","डोम थियेटर में","डिफैंस गैलरी में","डायनासोर पार्क में"],c:2,e:"ये साइंस सिटी की डिफैंस गैलरी में हैं।"},
 {q:"‘प्राचार्य’ शब्द का अर्थ क्या है?",a:["स्कूल का मुखिया","विद्यार्थी","खिलाड़ी","वैज्ञानिक"],c:0,e:"प्राचार्य का अर्थ स्कूल का मुखिया है।"},
 {q:"‘शिलान्यास’ का अर्थ क्या है?",a:["उद्घाटन करना","नींव पत्थर रखना","सम्मान करना","मनोरंजन करना"],c:1,e:"शिलान्यास का अर्थ नींव पत्थर रखना है।"},
 {q:"‘अभिवादन’ का अर्थ क्या है?",a:["सम्मान करना","डरना","खेलना","यात्रा करना"],c:0,e:"अभिवादन का अर्थ सम्मान करना है।"},
 {q:"‘वरिष्ठ’ का अर्थ क्या है?",a:["उम्र या क्रम में छोटा","पद या क्रम में बड़ा","नया विद्यार्थी","दर्शक"],c:1,e:"वरिष्ठ का अर्थ पद या क्रम में बड़ा है।"},
 {q:"‘जमात’ के लिए हिंदी शब्द क्या है?",a:["तालमेल","कक्षा","चश्मा","अनुमति"],c:1,e:"पंजाबी ‘ਜਮਾਤ’ का हिंदी शब्द ‘कक्षा’ है।"},
 {q:"‘ਐਨਕ’ का हिंदी अर्थ क्या है?",a:["किताब","पिक्चर","चश्मा","कक्षा"],c:2,e:"‘ਐਨਕ’ का हिंदी अर्थ चश्मा है।"},
 {q:"‘फैलाना’ से बना सही शब्द कौन-सा है?",a:["फैलाव","फैलित","फैलना ही","फैलाई"],c:0,e:"फैलाना से ‘फैलाव’ शब्द बनता है।"},
 {q:"‘मनोरंजन’ से बना विशेषण कौन-सा है?",a:["मनोरंजित","मनोरंजक","मनोरंजनता","मनोरंजनी"],c:1,e:"मनोरंजन से ‘मनोरंजक’ शब्द बनता है।"},
 {q:"‘अध्यापक’ का स्त्रीलिंग क्या है?",a:["अध्यापकी","अध्यापिका","अध्यापनी","अध्यापकनी"],c:1,e:"अध्यापक का स्त्रीलिंग अध्यापिका है।"},
 {q:"‘गायक’ का स्त्रीलिंग क्या है?",a:["गायकी","गायिका","गायनी","गायत्री"],c:1,e:"गायक का स्त्रीलिंग गायिका है।"},
 {q:"‘छुटियाँ’ का शुद्ध रूप क्या है?",a:["छुटिया","छुट्टियाँ","छुट्टीयाँ","छुटियाँ"],c:1,e:"शुद्ध वर्तनी ‘छुट्टियाँ’ है।"},
 {q:"‘परदर्शनी’ का शुद्ध रूप क्या है?",a:["प्रदर्शनी","परदर्शनी","प्रदर्शनीं","प्रदर्शननी"],c:0,e:"शुद्ध शब्द ‘प्रदर्शनी’ है।"},
 {q:"‘यदि…तो’ किस प्रकार के शब्द-युग्म का उदाहरण है?",a:["योजक शब्द-युग्म","विलोम शब्द","संज्ञा","मुहावरा"],c:0,e:"‘यदि…तो’ वाक्य में शर्त व्यक्त करता है और योजक शब्द-युग्म है।"},
 {q:"‘नाकों चने चबाना’ मुहावरे का अर्थ क्या है?",a:["बहुत खुश होना","बहुत परेशान करना","धीरे चलना","हार मानना"],c:1,e:"इस पाठ में इसका अर्थ परेशान करना दिया गया है।"},
 {q:"‘खुशी में गद्गद् होना’ का अर्थ क्या है?",a:["बहुत खुश होना","बहुत नाराज़ होना","घबरा जाना","थक जाना"],c:0,e:"इसका अर्थ बहुत खुश होना है।"}
];

let index=0, score=0, answered=false, soundOn=false, streak=0;
const $ = id => document.getElementById(id);

function beep(freq=660,duration=.12) {
  if(!soundOn) return;
  try {
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    const ctx=new Ctx();
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value=freq;
    osc.type="sine";
    gain.gain.setValueAtTime(.08,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
    osc.start();
    osc.stop(ctx.currentTime+duration);
    osc.onended=()=>ctx.close();
  } catch(e) {}
}

function confetti() {
  const bits=["🎉","✨","⭐","🎊","💜"];
  for(let i=0;i<18;i++) {
    const el=document.createElement("span");
    el.className="confetti";
    el.textContent=bits[Math.floor(Math.random()*bits.length)];
    el.style.left=Math.random()*100+"vw";
    el.style.animationDelay=(Math.random()*.45)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2200);
  }
}

function render() {
  answered=false;
  $("quiz").classList.remove("hidden");
  $("result").classList.add("hidden");

  const item=questions[index];
  $("counter").textContent=`📝 प्रश्न ${index+1} / ${questions.length}`;
  $("scoreTag").textContent=`🏆 अंक: ${score}`;
  $("streak").textContent=streak>=3
    ?`🔥 लगातार ${streak} सही जवाब! कमाल!`
    :index===0?"🚀 चलो शुरू करें!":"💪 अगला सवाल आपका है!";

  $("bar").style.width=`${(index/questions.length)*100}%`;
  $("question").textContent=`🤔 ${item.q}`;
  $("answers").innerHTML="";
  $("feedback").textContent="";
  $("next").disabled=true;

  item.a.forEach((choice,i)=>{
    const b=document.createElement("button");
    b.className="answer";

    const letter=document.createElement("span");
    letter.className="letter";
    letter.textContent=["क","ख","ग","घ"][i];

    const text=document.createElement("span");
    text.className="choice-text";
    text.textContent=choice;

    b.append(letter,text);
    b.addEventListener("click",()=>choose(i));
    $("answers").appendChild(b);
  });

  $("next").textContent=index===questions.length-1
    ?"🏆 परिणाम देखें":"अगला सवाल 🚀";
}

function choose(i) {
  if(answered) return;
  answered=true;

  const item=questions[index];
  const buttons=[...$("answers").children];

  buttons.forEach((b,j)=>{
    b.disabled=true;
    if(j===item.c) b.classList.add("correct");
    if(j===i && i!==item.c) b.classList.add("wrong");
  });

  if(i===item.c) {
    score++;
    streak++;
    $("feedback").textContent="🎉 बिल्कुल सही! "+item.e;
    beep(880,.16);
    if(streak>0 && streak%3===0) confetti();
  } else {
    streak=0;
    $("feedback").textContent=
      "💡 कोई बात नहीं! सही उत्तर: "+item.a[item.c]+". "+item.e;
    beep(260,.18);
  }

  $("streak").textContent=streak>=3
    ?`🔥 लगातार ${streak} सही जवाब! कमाल!`
    :i===item.c
      ?"🌟 शाबाश! ऐसे ही चलते रहो!"
      :"💜 सीखना ही जीत है—अगला सवाल आज़माओ!";

  $("scoreTag").textContent=`🏆 अंक: ${score}`;
  $("next").disabled=false;
}

function finish() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("bar").style.width="100%";
  $("finalScore").textContent=`${score} / ${questions.length}`;

  const pct=Math.round(score/questions.length*100);

  $("resultMessage").textContent=pct>=80
    ?`🌟 शानदार! आपने ${pct}% अंक प्राप्त किए। आपकी तैयारी बहुत अच्छी है!`
    :pct>=50
      ?`👏 अच्छा प्रयास! आपने ${pct}% अंक प्राप्त किए। गलत हुए उत्तर दोहराएँ और फिर कोशिश करें।`
      :`💪 आपने ${pct}% अंक प्राप्त किए। प्रश्न-उत्तर और शब्दार्थ दोहराएँ—आप अगली बार और अच्छा करेंगे!`;

  if(pct>=80) confetti();
  beep(pct>=80?990:520,.25);
}

function restart() {
  index=0;
  score=0;
  streak=0;
  render();
}

$("soundToggle").addEventListener("click",()=>{
  soundOn=!soundOn;
  $("soundToggle").textContent=soundOn
    ?"🔊 मज़ेदार आवाज़: चालू"
    :"🔊 मज़ेदार आवाज़: बंद";
  $("soundToggle").setAttribute("aria-pressed",String(soundOn));
  if(soundOn) beep(700,.12);
});

$("next").addEventListener("click",()=>{
  if(!answered) return;
  if(index<questions.length-1) {
    index++;
    render();
  } else {
    finish();
  }
});

$("restartSmall").addEventListener("click",restart);
$("again").addEventListener("click",restart);
$("back").addEventListener("click",()=>{
  restart();
  window.scrollTo({top:0,behavior:"smooth"});
});

render();
</script>
</body>
</html>
