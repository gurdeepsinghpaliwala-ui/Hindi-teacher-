<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कक्षा 6 हिंदी पाठ 7 - सूरज Quiz</title>
<style>
:root{--purple:#6d28d9;--pink:#db2777;--ink:#211b35;--muted:#6b647b;--bg:#f6f3ff;--card:#fff;--line:#e8e1f5}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:linear-gradient(145deg,#f5f3ff,#fff7fb);color:var(--ink);padding:18px}
.wrap{max-width:760px;margin:0 auto}
.hero{padding:26px 22px;border-radius:24px;background:linear-gradient(125deg,#5b21b6,#9333ea,#db2777);color:white;box-shadow:0 12px 30px #6d28d925;margin-bottom:18px}
.kicker{font-size:13px;opacity:.9;font-weight:bold;letter-spacing:.5px}
h1{margin:8px 0;font-size:clamp(25px,5vw,36px)}
.hero p{margin:8px 0 0;line-height:1.6}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 24px #31205a0c}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:bold}
.track{height:8px;background:#eee8fa;border-radius:99px;overflow:hidden;margin:14px 0 22px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#ec4899);transition:width .25s}
.tag{display:inline-block;background:#f3e8ff;color:#6b21a8;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:bold;margin-bottom:12px}
#question{font-size:21px;line-height:1.55;margin:0 0 18px}
.options{display:grid;gap:10px}
.option{width:100%;text-align:left;padding:14px 15px;border:1.5px solid var(--line);background:#fff;border-radius:14px;font-size:16px;color:var(--ink);cursor:pointer;transition:.15s}
.option:hover{border-color:#a78bfa;background:#faf7ff}
.option.selected{border-color:#7c3aed;background:#f3e8ff}
.option.correct{border-color:#16a34a;background:#f0fdf4}
.option.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;margin-top:14px;padding:13px 15px;border-radius:13px;line-height:1.5;font-size:14px}
.feedback.show{display:block}.feedback.good{background:#f0fdf4;color:#166534}.feedback.bad{background:#fef2f2;color:#991b1b}
.controls{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
button.nav{border:0;border-radius:12px;padding:12px 18px;font-weight:bold;font-size:15px;cursor:pointer}
#prev{background:#f1ecfa;color:#4c1d95}#next,#restart{background:linear-gradient(110deg,#6d28d9,#db2777);color:white}
button:disabled{opacity:.4;cursor:not-allowed}
.result{text-align:center;display:none}.score{font-size:48px;font-weight:800;color:#7c3aed;margin:8px}
.result h2{margin-bottom:4px}.result p{color:var(--muted);line-height:1.6}
.review{margin-top:18px;text-align:left}.review-item{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0;line-height:1.5}
.small{font-size:13px;color:var(--muted)}
@media(max-width:520px){body{padding:10px}.hero{padding:22px 18px}.panel{padding:16px}#question{font-size:19px}.option{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="kicker">कक्षा 6 • हिंदी • पाठ 7</div>
    <h1>☀️ सूरज — Online Quiz</h1>
    <p>महत्वपूर्ण प्रश्न, शब्दार्थ, पर्यायवाची, संयुक्त व्यंजन और अक्षर-क्रम का अभ्यास करें।</p>
  </header>
  <main class="panel" id="quiz">
    <div class="topline"><span id="counter">प्रश्न 1 / 20</span><span id="answered">उत्तर दिए: 0</span></div>
    <div class="track"><div class="fill" id="progress"></div></div>
    <span class="tag" id="category">प्रश्नोत्तर</span>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="controls">
      <button class="nav" id="prev" type="button">← पिछला</button>
      <button class="nav" id="next" type="button">अगला प्रश्न →</button>
    </div>
  </main>
  <section class="panel result" id="result">
    <div style="font-size:44px">🏆</div><h2>Quiz पूरा हुआ!</h2>
    <div class="score" id="score">0/20</div><p id="summary"></p>
    <button class="nav" id="restart" type="button">फिर से Quiz दें ↻</button>
    <div class="review" id="review"></div>
  </section>
  <p class="small" style="text-align:center;margin:16px 0">अपना उत्तर चुनें, फिर “अगला प्रश्न” दबाएँ।</p>
</div>
<script>
const questions = [
{c:"कविता का भाव",q:"सूरज के निकलने पर क्या फैल जाता है?",o:["अँधेरा","प्रकाश","धुआँ","कोहरा"],a:1,e:"सूरज के निकलने पर प्रकाश फैल जाता है।"},
{c:"दिशाएँ",q:"सूरज किस दिशा से निकलता है?",o:["पश्चिम","उत्तर","पूर्व","दक्षिण"],a:2,e:"सूरज पूर्व दिशा से निकलता है।"},
{c:"दिशाएँ",q:"सूरज किस दिशा में छिपता है?",o:["पूर्व","पश्चिम","उत्तर","दक्षिण"],a:1,e:"सूरज पश्चिम दिशा में छिपता है।"},
{c:"प्रेरणा",q:"सूरज हमें जीवन में क्या करने की प्रेरणा देता है?",o:["रुक जाने की","लगातार आगे बढ़ने की","देर तक सोने की","काम छोड़ने की"],a:1,e:"सूरज लगातार आगे बढ़ने और सुबह जल्दी उठने की प्रेरणा देता है।"},
{c:"बिजली संकट",q:"बिजली के संकट से उबरने के लिए कवि ने किस विकल्प का सुझाव दिया है?",o:["कोयला ऊर्जा","सौर ऊर्जा","डीज़ल ऊर्जा","लकड़ी जलाना"],a:1,e:"कवि ने सौर ऊर्जा के प्रयोग का विकल्प सुझाया है।"},
{c:"शब्दार्थ",q:"‘निरंतर’ शब्द का सही अर्थ क्या है?",o:["कभी-कभी","लगातार","अचानक","धीरे-धीरे"],a:1,e:"निरंतर का अर्थ लगातार होता है।"},
{c:"शब्दार्थ",q:"‘पश्चिम’ का पंजाबी शब्द कौन-सा दिया गया है?",o:["ਪੂਰਵ","ਪੱਛਮ","ਦਿਸ਼ਾ","ਸਵੇਰੇ"],a:1,e:"पाठ में ਪੱਛਮ = पश्चिम दिया गया है।"},
{c:"शब्दार्थ",q:"‘संकट’ का पंजाबी शब्द कौन-सा दिया गया है?",o:["ਸੰਕਟ","ਸੂਰਜ","ਸਰਦੀ","ਬਿਜਲੀ"],a:0,e:"पाठ में ਸੰਕਟ = संकट दिया गया है।"},
{c:"शब्दार्थ",q:"‘सवेरे’ का पंजाबी शब्द कौन-सा है?",o:["ਸਵੇਰੇ","ਗਰਮੀ","ਦਿਸ਼ਾ","ਸੰਕਟ"],a:0,e:"पाठ में ਸਵੇਰੇ = सवेरे दिया गया है।"},
{c:"शब्दार्थ",q:"‘ढल’ के लिए पाठ में कौन-सा पंजाबी शब्द दिया गया है?",o:["ਖਬਰ","ਛਿਪ","ਸਿੱਖਿਆ","ਲਗਾਤਾਰ"],a:1,e:"पाठ में ਛਿਪ = ढल दिया गया है।"},
{c:"पर्यायवाची",q:"‘सूरज’ का पर्यायवाची कौन-सा है?",o:["दिनकर","निशाकर","पवन","जलधर"],a:0,e:"दिनकर, सूरज का पर्यायवाची है।"},
{c:"पर्यायवाची",q:"‘सुबह’ का पर्यायवाची कौन-सा है?",o:["संध्या","सायंकाल","प्रातः","रात्रि"],a:2,e:"प्रातः, सुबह का पर्यायवाची है।"},
{c:"पर्यायवाची",q:"‘संदेशा’ का पर्यायवाची कौन-सा है?",o:["बाधा","समाचार","व्यायाम","संकट"],a:1,e:"समाचार, संदेशा का पर्यायवाची है।"},
{c:"शब्द प्रयोग",q:"‘संध्या’ शब्द का एक अर्थ दिन का कौन-सा समय है?",o:["दोपहर","आधी रात","शाम","सुबह"],a:2,e:"संध्या का अर्थ शाम भी होता है।"},
{c:"संयुक्त व्यंजन",q:"‘शिक्षा’ शब्द में कौन-सा संयुक्त व्यंजन है?",o:["ट्ट","क्ष","ध्य","श्च"],a:1,e:"शिक्षा में क्ष (क् + ष) संयुक्त व्यंजन है।"},
{c:"संयुक्त व्यंजन",q:"‘संध्या’ शब्द में कौन-सा संयुक्त व्यंजन है?",o:["क्ष","श्च","ध्य","ट्ट"],a:2,e:"संध्या में ध्य संयुक्त व्यंजन है।"},
{c:"संयुक्त व्यंजन",q:"‘छुट्टी’ शब्द के उदाहरण में कौन-सा संयुक्त व्यंजन है?",o:["ट्ट","क्ष","स्र","ध्य"],a:0,e:"छुट्टी में ट्ट संयुक्त व्यंजन है।"},
{c:"अक्षर क्रम",q:"‘लानिक’ अक्षरों को सही क्रम में रखने पर कौन-सा शब्द बनता है?",o:["निकलना","निकला","किलना","नालिक"],a:1,e:"लानिक से ‘निकला’ शब्द बनता है।"},
{c:"अक्षर क्रम",q:"‘याजिउरा’ अक्षरों से कौन-सा सार्थक शब्द बनता है?",o:["उजियारा","उजाला","आरजू","जुगनू"],a:0,e:"सही क्रम में ‘उजियारा’ बनता है।"},
{c:"अक्षर क्रम",q:"‘राबाताघ’ अक्षरों को सही क्रम में रखने पर कौन-सा शब्द बनता है?",o:["घबराता","बाताघर","बरात","घाट"],a:0,e:"सही शब्द ‘घबराता’ है।"}
];
let index=0, answers=Array(questions.length).fill(null), locked=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function render(){
 const q=questions[index]; $("counter").textContent=`प्रश्न ${index+1} / ${questions.length}`;
 $("answered").textContent=`उत्तर दिए: ${answers.filter(x=>x!==null).length}`;
 $("progress").style.width=`${((index+1)/questions.length)*100}%`;
 $("category").textContent=q.c; $("question").textContent=q.q;
 $("options").innerHTML="";
 q.o.forEach((opt,i)=>{
  const b=document.createElement("button"); b.type="button"; b.className="option"; b.textContent=`${["A","B","C","D"][i]}. ${opt}`;
  if(answers[index]===i)b.classList.add("selected");
  if(locked[index]&&i===q.a)b.classList.add("correct");
  if(locked[index]&&answers[index]===i&&i!==q.a)b.classList.add("wrong");
  b.disabled=locked[index]; b.addEventListener("click",()=>choose(i)); $("options").appendChild(b);
 });
 const f=$("feedback"); f.className="feedback"; f.textContent="";
 if(locked[index]){f.classList.add("show",answers[index]===q.a?"good":"bad");f.textContent=(answers[index]===q.a?"सही उत्तर! ":"सही उत्तर: "+q.o[q.a]+". ")+q.e;}
 $("prev").disabled=index===0; $("next").textContent=index===questions.length-1?"परिणाम देखें 🏁":"अगला प्रश्न →";
}
function choose(i){if(locked[index])return;answers[index]=i;locked[index]=true;render();}
$("prev").addEventListener("click",()=>{if(index>0){index--;render();}});
$("next").addEventListener("click",()=>{if(index<questions.length-1){index++;render();}else showResult();});
function showResult(){
 $("quiz").style.display="none";document.querySelector(".small").style.display="none";$("result").style.display="block";
 const score=answers.reduce((n,a,i)=>n+(a===questions[i].a?1:0),0);
 $("score").textContent=`${score} / ${questions.length}`;
 $("summary").textContent=`आपका स्कोर ${Math.round(score/questions.length*100)}% है। ${score>=16?"बहुत बढ़िया!":"अच्छा प्रयास! दोबारा अभ्यास करके स्कोर बढ़ाएँ।"}`;
 $("review").innerHTML="<h3>उत्तर की समीक्षा</h3>"+questions.map((q,i)=>`<div class="review-item"><b>${i+1}. ${q.q}</b><br><span style="color:${answers[i]===q.a?'#15803d':'#b91c1c'}">आपका उत्तर: ${answers[i]===null?'नहीं दिया':q.o[answers[i]]}</span><br><b>सही उत्तर:</b> ${q.o[q.a]}<br><span class="small">${q.e}</span></div>`).join("");
}
$("restart").addEventListener("click",()=>{index=0;answers=Array(questions.length).fill(null);locked=Array(questions.length).fill(false);$("result").style.display="none";$("quiz").style.display="block";document.querySelector(".small").style.display="block";render();window.scrollTo({top:0,behavior:"smooth"});});
render();
</script>
</body>
</html>
