<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पाठ 4 इन्द्रधनुष Quiz | कक्षा 6 हिंदी</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px 12px;background:#f5f7fb;color:#1f2937;font-family:Arial,"Noto Sans Devanagari",sans-serif;line-height:1.7}
.container{max-width:760px;margin:auto}
.header{background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;text-align:center;padding:24px 15px;border-radius:16px;margin-bottom:16px}
.header h1{font-size:25px;margin:0}.header p{margin:5px 0 0}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 4px 14px #1111}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#64748b;font-size:14px}
.track{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 20px}
#bar{height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#a855f7);transition:width .2s}
#qtitle{font-size:20px;line-height:1.5;color:#312e81;margin:8px 0 18px}
.answers{display:grid;gap:10px}
.answer{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid #dbe1ea;border-radius:10px;cursor:pointer;background:#fff}
.answer:has(input:checked){border-color:#7c3aed;background:#f5f3ff}
.answer input{width:18px;height:18px;accent-color:#6d28d9;flex-shrink:0}
.answer span{font-size:16px}
.actions{display:flex;gap:10px;margin-top:20px}
button{border:0;border-radius:9px;padding:12px 16px;font-size:16px;font-weight:bold;cursor:pointer}
#next{background:#4f46e5;color:#fff;flex:1}
#prev{background:#e5e7eb;color:#374151}
button:disabled{opacity:.45;cursor:not-allowed}
#feedback{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#f0fdf4;color:#166534}
#feedback.bad{background:#fef2f2;color:#991b1b}
#result{display:none;text-align:center;border-top:4px solid #16a34a}
#result h2{color:#166534}
#review{text-align:left;margin-top:16px}
.review-item{border-top:1px solid #e5e7eb;padding:12px 0}
.small{font-size:13px;color:#64748b}
@media(max-width:480px){.header h1{font-size:22px}.card{padding:14px}#qtitle{font-size:18px}.actions button{font-size:15px}}
</style>
</head>
<body>
<div class="container">
<header class="header">
<h1>🌈 पाठ–4: इन्द्रधनुष</h1>
<p>कक्षा 6 हिंदी | Online Quiz</p>
</header>
<section class="card">
<div class="topline"><span id="count">प्रश्न 1 / 20</span><span id="answered">उत्तर दिए: 0</span></div>
<div class="track"><div id="bar"></div></div>
<div class="small" id="kind">बहुविकल्पीय प्रश्न</div>
<h2 id="qtitle"></h2>
<div class="answers" id="answers"></div>
<div id="feedback" role="status"></div>
<div class="actions">
<button id="prev" type="button">← पिछला</button>
<button id="next" type="button">Next Question →</button>
</div>
<p class="small">पहले विकल्प चुनें, फिर Next Question दबाएँ। अंतिम प्रश्न पर Submit Quiz दिखाई देगा।</p>
</section>
<section class="card" id="result">
<h2>📊 आपका परिणाम</h2>
<p id="score"></p>
<p id="message"></p>
<div id="review"></div>
<button type="button" id="restart" style="background:#4f46e5;color:white;width:100%">🔄 दोबारा टेस्ट दें</button>
</section>
</div>
<script>
const questions=[
{t:"mcq",q:"कविता में बादलों का रंग कैसा बताया गया है?",o:["काला","सफेद","लाल","पीला"],a:0,e:"कविता में बादलों का रंग काला बताया गया है।"},
{t:"mcq",q:"वर्षा के बाद प्रकृति कैसी दिखाई देती है?",o:["सूखी","हरी-भरी","बंजर","धूल भरी"],a:1,e:"वर्षा के बाद प्रकृति हरी-भरी दिखाई देती है।"},
{t:"mcq",q:"वर्षा के बाद सूर्य दिखाई देने पर नभ पर क्या दिखाई देता है?",o:["तारे","चाँद","इन्द्रधनुष","ओस"],a:2,e:"वर्षा के बाद सूर्य दिखाई देने पर नभ पर इन्द्रधनुष दिखाई देता है।"},
{t:"mcq",q:"इन्द्रधनुष का आकार कैसा होता है?",o:["चौकोर","त्रिभुज जैसा","सीधी रेखा जैसा","अर्ध-वृत्त जैसा"],a:3,e:"इन्द्रधनुष का आकार अर्ध-वृत्त या आधे गोले जैसा होता है।"},
{t:"mcq",q:"कवि ने इन्द्रधनुष के लिए कौन-सा अन्य शब्द प्रयोग किया है?",o:["सतरंगी पींघ","मेघ","किरण","धरा"],a:0,e:"कविता में इन्द्रधनुष के लिए सतरंगी पींघ शब्द आया है।"},
{t:"mcq",q:"'प्रभु' का पर्यायवाची शब्द कौन-सा है?",o:["जलद","परमात्मा","गगन","धरा"],a:1,e:"प्रभु के पर्यायवाची परमात्मा और ईश्वर हैं।"},
{t:"mcq",q:"'मेघ' का पर्यायवाची शब्द कौन-सा है?",o:["आँगन","छेद","बादल","किरण"],a:2,e:"मेघ का अर्थ बादल होता है।"},
{t:"mcq",q:"'नभ' का पर्यायवाची शब्द कौन-सा है?",o:["वर्षा","प्रकृति","झूला","आकाश"],a:3,e:"नभ के पर्यायवाची आकाश और गगन हैं।"},
{t:"mcq",q:"'अचानक' का हिंदी अर्थ क्या है?",o:["सहसा","आँगन","मेघ","नभ"],a:0,e:"अचानक का समान अर्थ सहसा है।"},
{t:"mcq",q:"पंजाबी शब्द 'ਧਰਤੀ' का हिंदी अर्थ क्या है?",o:["आकाश","धरा","झूला","छेद"],a:1,e:"'ਧਰਤੀ' का हिंदी अर्थ धरा या धरती है।"},
{t:"mcq",q:"इन्द्रधनुष में कितने रंग माने जाते हैं?",o:["पाँच","छह","सात","आठ"],a:2,e:"इन्द्रधनुष में सात रंग माने जाते हैं।"},
{t:"mcq",q:"वर्षा ऋतु में कौन नाचता है?",o:["कौआ","कबूतर","तोता","मोर"],a:3,e:"वर्षा ऋतु में मोर नाचते हैं।"},
{t:"mcq",q:"यदि वर्षा न हो तो क्या पड़ सकता है?",o:["सूखा","बाढ़","हिमपात","ओले"],a:0,e:"वर्षा न होने पर सूखा पड़ सकता है।"},
{t:"mcq",q:"अधिक वर्षा होने पर क्या हो सकता है?",o:["सूखा","बाढ़","गर्मी","पाला"],a:1,e:"अधिक वर्षा से बाढ़ आ सकती है और फसलों को नुकसान हो सकता है।"},
{t:"mcq",q:"'किरण' का एक पर्यायवाची कौन-सा है?",o:["मेघ","धरा","मयूख","आँगन"],a:2,e:"किरण के पर्यायवाची कर और मयूख हैं।"},
{t:"tf",q:"वर्षा के बाद प्रकृति हरी-भरी दिखाई देती है।",a:true,e:"वर्षा के बाद प्रकृति हरी-भरी दिखाई देती है।"},
{t:"tf",q:"'नभ' का अर्थ धरती होता है।",a:false,e:"नभ का अर्थ आकाश या गगन होता है।"},
{t:"tf",q:"'कर्म' शब्द में 'र्म' संयुक्त अक्षर है।",a:true,e:"कर्म शब्द में र् और म मिलकर 'र्म' बनाते हैं।"},
{t:"tf",q:"वर्षा न होने से फसलों को पर्याप्त पानी मिलता है।",a:false,e:"वर्षा न होने पर फसलों को पानी की कमी हो सकती है।"},
{t:"tf",q:"वर्षा ऋतु हमें मुस्कुराकर खुशियाँ फैलाने का संदेश देती है।",a:true,e:"कविता हमें मुस्कुराते रहने और चारों ओर खुशियाँ फैलाने का संदेश देती है।"}
];
let index=0;
const selected=Array(questions.length).fill(null);
const letters=["क","ख","ग","घ"];
const title=document.getElementById("qtitle"), answers=document.getElementById("answers");
const feedback=document.getElementById("feedback"), next=document.getElementById("next");
function render(){
 const item=questions[index];
 document.getElementById("count").textContent=`प्रश्न ${index+1} / ${questions.length}`;
 document.getElementById("answered").textContent=`उत्तर दिए: ${selected.filter(v=>v!==null).length}`;
 document.getElementById("bar").style.width=`${((index+1)/questions.length)*100}%`;
 document.getElementById("kind").textContent=item.t==="tf"?"सही या गलत चुनें":"बहुविकल्पीय प्रश्न";
 title.textContent=item.q; answers.replaceChildren();
 const opts=item.t==="mcq"?item.o:["सही","गलत"];
 opts.forEach((label,j)=>{
  const lab=document.createElement("label");lab.className="answer";
  const inp=document.createElement("input");inp.type="radio";inp.name="answer";inp.value=item.t==="mcq"?String(j):(j===0?"true":"false");
  const val=item.t==="mcq"?String(j):(j===0?"true":"false");
  inp.checked=selected[index]===val;
  inp.addEventListener("change",()=>{selected[index]=val;feedback.style.display="none";document.getElementById("answered").textContent=`उत्तर दिए: ${selected.filter(v=>v!==null).length}`;});
  const span=document.createElement("span");span.textContent=item.t==="mcq"?`(${letters[j]}) ${label}`:label;
  lab.append(inp,span);answers.append(lab);
 });
 feedback.style.display="none";feedback.className="";
 document.getElementById("prev").disabled=index===0;
 next.textContent=index===questions.length-1?"🏁 Submit Quiz":"Next Question →";
}
document.getElementById("prev").addEventListener("click",()=>{if(index>0){index--;render();}});
next.addEventListener("click",()=>{
 if(selected[index]===null){feedback.textContent="कृपया पहले एक विकल्प चुनें।";feedback.className="bad";feedback.style.display="block";return;}
 if(index<questions.length-1){index++;render();}else showResult();
});
function showResult(){
 let score=0;const review=document.getElementById("review");review.replaceChildren();
 questions.forEach((item,i)=>{
  const correct=item.t==="mcq"?String(item.a):String(item.a);
  const ok=selected[i]===correct;if(ok)score++;
  const div=document.createElement("div");div.className="review-item";
  const p=document.createElement("p");p.className=ok?"correct":"wrong";
  const ans=item.t==="mcq"?item.o[item.a]:(item.a?"सही":"गलत");
  p.textContent=`${i+1}. ${ok?"✓ सही":"✗ गलत"} — सही उत्तर: ${ans}`;
  const note=document.createElement("div");note.className="small";note.textContent=item.e;
  div.append(p,note);review.append(div);
 });
 document.getElementById("score").textContent=`आपके अंक: ${score} / ${questions.length} (${Math.round(score/questions.length*100)}%)`;
 document.getElementById("message").textContent=score>=16?"बहुत बढ़िया! आपकी तैयारी अच्छी है।":score>=10?"अच्छा प्रयास! गलत उत्तरों को दोबारा पढ़ें।":"पाठ के नोट्स पढ़कर फिर से अभ्यास करें।";
 document.querySelector(".container").querySelectorAll(".card")[0].style.display="none";
 document.getElementById("result").style.display="block";
 window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("restart").addEventListener("click",()=>{
 index=0;selected.fill(null);
 document.querySelector(".container").querySelectorAll(".card")[0].style.display="block";
 document.getElementById("result").style.display="none";render();window.scrollTo({top:0,behavior:"smooth"});
});
render();
</script>
</body>
</html>
