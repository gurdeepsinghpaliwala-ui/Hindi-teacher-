let current=0;
let score=0;
let answered=false;

function loadQuestion(){

answered=false;

const item=questions[current];

document.getElementById("counter").textContent=
`प्रश्न ${current+1} / ${questions.length}`;

document.getElementById("progress").style.width=
`${(current/questions.length)*100}%`;

document.getElementById("question").textContent=
`${current+1}. ${item.q}`;

document.getElementById("feedback").textContent="";

document.getElementById("nextBtn").style.display="none";

const box=document.getElementById("options");

box.innerHTML="";

item.options.forEach((option,index)=>{

const button=document.createElement("button");

button.className="option";

button.textContent=
`${String.fromCharCode(65+index)}. ${option}`;

button.onclick=()=>chooseAnswer(index,button);

box.appendChild(button);

});

}


function chooseAnswer(index,button){

if(answered)return;

answered=true;

const item=questions[current];

const buttons=document.querySelectorAll(".option");

buttons.forEach((b,i)=>{

b.disabled=true;

if(i===item.answer){
b.classList.add("correct");
}

});

const feedback=document.getElementById("feedback");

if(index===item.answer){

score++;

feedback.textContent="✅ बिल्कुल सही उत्तर!";

feedback.style.color="#15803d";

}else{

button.classList.add("wrong");

feedback.textContent=
`❌ गलत उत्तर। सही उत्तर: ${item.options[item.answer]}`;

feedback.style.color="#dc2626";

}

document.getElementById("progress").style.width=
`${((current+1)/questions.length)*100}%`;

const next=document.getElementById("nextBtn");

next.style.display="inline-block";

next.textContent=
current===questions.length-1
?"परिणाम देखें 🏆"
:"अगला प्रश्न ➜";

}


function nextQuestion(){

if(!answered)return;

current++;

if(current<questions.length){

loadQuestion();

}else{

document.getElementById("quiz").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("score").textContent=
`${score} / ${questions.length}`;

const percent=
Math.round((score/questions.length)*100);

document.getElementById("message").textContent=

percent>=80
?"🌟 बहुत बढ़िया! आपकी तैयारी बहुत अच्छी है।"
:
percent>=50
?"👍 अच्छा प्रयास! थोड़ा और अभ्यास करें।"
:
"📚 पाठ को दोबारा पढ़ें और फिर टेस्ट दें।";

}

}


function restartQuiz(){

current=0;

score=0;

answered=false;

document.getElementById("result").style.display="none";

document.getElementById("quiz").style.display="block";

loadQuestion();

}
